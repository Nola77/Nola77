<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t">
<title id="t">Nola (Dorji Phuntsho): frontend developer and creative technologist from Bhutan</title>
<style>
.tw{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.flag{transform-box:fill-box;transform-origin:0% 50%;animation:sway 3.4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:scaleX(1) skewY(0deg)}50%{transform:scaleX(.82) skewY(4deg)}}
.lamp{animation:flick 2.8s ease-in-out infinite}
@keyframes flick{0%,100%{opacity:.95}40%{opacity:.55}70%{opacity:.85}}
.river{animation:flow 7s linear infinite}
@keyframes flow{to{stroke-dashoffset:-120}}
.cursor{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.mist{animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
.bird{animation:glide 14s ease-in-out infinite alternate}
@keyframes glide{from{transform:translate(0,0)}to{transform:translate(-90px,-14px)}}
.pen{transform-box:fill-box;transform-origin:50% 0%;animation:flut 2.6s ease-in-out infinite}
@keyframes flut{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
</style>
