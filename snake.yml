name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *" # daily, 00:00 UTC (06:00 in Thimphu)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake SVGs (saffron theme, light + dark)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-saffron-light.svg?color_snake=#7c2424&color_dots=#ebedf0,#f6dcae,#eebf6e,#d9952f,#a8661a
            dist/snake-saffron-dark.svg?palette=github-dark&color_snake=#e5a84b&color_dots=#161b22,#4a2a12,#7a4a1c,#b8742a,#e5a84b

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
